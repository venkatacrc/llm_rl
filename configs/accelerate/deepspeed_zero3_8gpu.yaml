# DeepSpeed ZeRO-3 across all 8 B200s -- alternative to FSDP for the lab 07 capstone,
# and the config referenced by the "colocated vLLM + DeepSpeed ZeRO-3" recipe TRL
# documents for GRPO at scale (optimizer-state offload frees room for the vLLM engine
# sharing the same GPUs).
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
  offload_optimizer_device: cpu
  offload_param_device: none
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
